# nginx site for pooltv.me. Install on the server:
#   sudo ln -s /var/www/pool-tv/nginx.conf /etc/nginx/sites-enabled/pooltv.me
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pooltv.me -d www.pooltv.me   # adds HTTPS + redirect

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pooltv_backend {
    server 127.0.0.1:3010;
}

server {
    listen 80;
    listen [::]:80;
    server_name pooltv.me www.pooltv.me;

    # SvelteKit SPA (static build)
    root /var/www/pool-tv/frontend/build;
    index index.html;

    # Logo / sponsor uploads
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rails: JSON API, health check, Active Storage links
    location ~ ^/(api|up|rails)(/|$) {
        proxy_pass http://pooltv_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Action Cable (WebSocket)
    location /cable {
        proxy_pass http://pooltv_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Hashed build assets never change
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else: the SPA (fallback to index.html)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
